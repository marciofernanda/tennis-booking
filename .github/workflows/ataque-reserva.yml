name: ⚡ Ataque de Reserva - Tennis Court

on:
  schedule:
    - cron: '0 3 * * 5'
  
  workflow_dispatch:

jobs:
  attack-reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache de dependências
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -q selenium webdriver-manager requests pytz
      
      - name: Instalar ChromeDriver
        uses: nanasess/setup-chromedriver@master
        with:
          chromedriver-version: '127.0.6533.99'
      
      - name: Exibir informações do sistema
        run: |
          echo "🖥️  Sistema: $(uname -s)"
          echo "🐍 Python: $(python --version)"
          echo "🌐 Chrome: $(google-chrome --version)"
          echo "⏰ Hora UTC: $(date -u)"
          echo "⏰ Hora SP: $(TZ='America/Sao_Paulo' date)"
      
      - name: "🚀 ATAQUE DE RESERVA!"
        env:
          LETZPLAY_EMAIL: ${{ secrets.LETZPLAY_EMAIL }}
          LETZPLAY_PASSWORD: ${{ secrets.LETZPLAY_PASSWORD }}
          CI: true
          PYTHONUNBUFFERED: 1
        run: python tennis_booking_v4.py
      
      - name: ✅ Sucesso!
        if: success()
        run: echo "✅ Reserva realizada com sucesso às $(date)"
      
      - name: ❌ Falha
        if: failure()
        run: |
          echo "❌ Falha na reserva"
          exit 1

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: attack-reservation
    if: failure()
    
    steps:
      - name: 📢 Notificar Falha
        run: |
          echo "⚠️ ALERTA: Falha ao reservar quadra de tênis"
          echo "Verifique: https://github.com/${{ github.repository }}
